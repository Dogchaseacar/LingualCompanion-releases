# 把 GitHub Release 的 dmg 同步到 Gitee 镜像仓库(大陆用户下载源)。
# 为什么在 CI 里跑:开发机(海外)直传 Gitee 走跨境民用线路只有几 KB/s,
# Azure 机房线路好得多;且发版自动触发,无人值守。
# exe(122MB)超出 Gitee 免费版单附件 100MB 上限,走 Cloudflare R2,不在此同步。
name: Sync release to Gitee mirror

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v1.0.6)"
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Download dmg from GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'LingualCompanion.dmg' --dir assets
          ls -l assets/

      - name: Upload to Gitee release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          GITEE_REPO: doggydoggy/LingualCompanion-releases
        run: |
          api="https://gitee.com/api/v5/repos/$GITEE_REPO/releases"

          rid=$(curl -s "$api/tags/$TAG?access_token=$GITEE_TOKEN" | jq -r '.id // empty')
          if [ -z "$rid" ]; then
            echo "Gitee release for $TAG missing, creating"
            rid=$(curl -s -X POST "$api" \
              -d "access_token=$GITEE_TOKEN" \
              -d "tag_name=$TAG" -d "name=$TAG" \
              -d "body=LingualCompanion $TAG 国内下载镜像。同步自 GitHub Releases。" \
              -d "target_commitish=master" | jq -r '.id')
          fi
          echo "Gitee release id: $rid"

          # 重跑安全:同名旧附件先删再传
          curl -s "$api/$rid/attach_files?access_token=$GITEE_TOKEN" \
            | jq -r '.[] | select(.name=="LingualCompanion.dmg") | .id' \
            | while read -r aid; do
                echo "Deleting stale attachment $aid"
                curl -s -X DELETE "$api/$rid/attach_files/$aid?access_token=$GITEE_TOKEN"
              done

          for i in 1 2 3; do
            echo "Upload attempt $i"
            curl -sS --http1.1 -H "Expect:" --max-time 1800 -X POST \
              "$api/$rid/attach_files?access_token=$GITEE_TOKEN" \
              -F "file=@assets/LingualCompanion.dmg" \
              -o resp.json \
              -w "HTTP:%{http_code} uploaded:%{size_upload}B time:%{time_total}s speed:%{speed_upload}B/s\n" \
              && jq -e '.browser_download_url' resp.json >/dev/null 2>&1 && break
            echo "Attempt $i failed:"; cat resp.json 2>/dev/null || true; echo; sleep 10
          done

          jq -er '.browser_download_url' resp.json
